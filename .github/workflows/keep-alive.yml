name: keep-alive-noturno

on:
  schedule:
    - cron: "0 23 * * *"   # 23:00 UTC (00:00 PT) — cobre a madrugada ate ~05:00
    - cron: "0 5 * * *"    # 05:00 UTC (06:00 PT) — cobre ate ~11:00
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: presistent-keep-alive
  cancel-in-progress: false

env:
  RENDER_HEALTH: https://akira-ia.onrender.com/api/health
  PRESISTEN_SEED: https://presisenet.vercel.app/api/chain

jobs:
  madrugada:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Loop de pings diretos a Render (cada 3 min, ~6h)
        run: |
          TOKEN="${{ secrets.SIM_TOKEN }}"
          if [ -z "$TOKEN" ]; then TOKEN='c955c3820dbdda7e8af70f74'; fi
          for i in $(seq 1 110); do
            TS=$(date -u '+%Y-%m-%d %H:%M:%S')
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' -m 25 "$RENDER_HEALTH" || echo "ERR")
            echo "[$TS] iter=$i render=$CODE"
            if [ "$(( i % 10 ))" -eq 0 ]; then
              VCODE=$(curl -sS -o /dev/null -w '%{http_code}' -m 30 "$PRESISTEN_SEED?depth=0&token=${TOKEN}&from=gh-nightly" || echo "ERR")
              echo "[$TS] reseed da cadeia Vercel -> $VCODE"
            fi
            sleep 180
          done